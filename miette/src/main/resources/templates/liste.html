<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Liste des recettes')}"></head>
<body class="container-fluid px-0">
    <div th:replace="~{fragments/header :: site-header}"></div>
    <div th:replace="~{fragments/login-modal :: login-modal}"></div>

    <div class="page-content">
    <!-- Barre de recherche -->
    <div class="search-bar mb-4">
        <form method="GET">
            <div class="d-flex">
                <input type="search" name="q"
                    th:value="${query}"
                    th:placeholder="${isSearchMode} ? 'Recherche active...' : 'Titre, ingrédients, étapes, tags...'"
                    class="form-control form-control-lg me-2">
                <button type="submit" class="btn btn-primary btn-lg px-4">
                    <i class="bi bi-search"></i>
                </button>
            </div>
            <div class="d-flex gap-3 mt-2">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="withNotes" id="withNotes"
                        th:checked="${withNotes}" onchange="this.form.submit()">
                    <label class="form-check-label" for="withNotes">
                        <i class="bi bi-journal-text"></i> Avec notes
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="withPhotos" id="withPhotos"
                        th:checked="${withPhotos}" onchange="this.form.submit()">
                    <label class="form-check-label" for="withPhotos">
                        <i class="bi bi-image"></i> Avec photos
                    </label>
                </div>
            </div>
        </form>
    </div>

    <!-- Message de succès (ex: suppression) -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> 
        <span th:text="${message}">Supprimé !</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    
    <!-- Résultats ou "Tout" + toggle vue -->
    <div th:if="${isSearchMode}" class="alert alert-info d-flex justify-content-between align-items-center">
        <span><i class="bi bi-search"></i> <span th:text="'Trouvé ' + ${resultCount} + ' recette(s)'"></span></span>
        <div class="d-flex align-items-center gap-2">
            <div class="btn-group btn-group-sm" id="viewToggle">
                <button type="button" class="btn btn-outline-primary active" id="btnGrid" title="Grille"><i class="bi bi-grid"></i></button>
                <button type="button" class="btn btn-outline-primary" id="btnList" title="Liste"><i class="bi bi-list-ul"></i></button>
            </div>
            <a href="/recettes" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-grid-3x3-gap"></i> Voir toutes les recettes
            </a>
        </div>
    </div>
    <div th:unless="${isSearchMode}" class="alert alert-success d-flex justify-content-between align-items-center">
        <span><i class="bi bi-list-ul"></i> Toutes les recettes (<span th:text="${resultCount}"></span>)</span>
        <div class="btn-group btn-group-sm" id="viewToggle">
            <button type="button" class="btn btn-outline-success active" id="btnGrid" title="Grille"><i class="bi bi-grid"></i></button>
            <button type="button" class="btn btn-outline-success" id="btnList" title="Liste"><i class="bi bi-list-ul"></i></button>
        </div>
    </div>

    <!-- Bouton "Nouvelle recette" (si admin) -->
    <div sec:authorize="hasRole('ADMIN')" class="mb-4">
        <a th:href="@{/recette/new}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Nouvelle recette
        </a>
    </div>
    
    <div th:if="${recipes.isEmpty()}">
        <p class="alert alert-info">Aucune recette</p>
    </div>
    
    <div th:unless="${recipes.isEmpty()}" id="recipeGrid" class="row g-3">
        <div th:each="recipe : ${recipes}" class="col-12 col-md-6 col-lg-4 recipe-grid-item">
            <a th:href="@{/recette/{id}(id=${recipe.id})}" class="text-decoration-none recipe-link">
                <div class="card h-100">
                    <div class="card-header">
                        <h5 class="card-title mb-0" th:text="${recipe.title}">Recette</h5>
                        <div th:if="${!#sets.isEmpty(recipe.tags)}" class="mt-2">
                            <span th:each="tagRel : ${recipe.tags}" 
                            th:text="${tagRel.tag.label}" 
                            class="badge bg-primary me-1"></span>
                        </div>
                    </div>
                    <div th:with="noteCount=${#lists.size(recipe.assets.?[asset.type.name() == 'NOTE'])}, photoCount=${#lists.size(recipe.assets.?[asset.type.name() == 'PHOTO'])}"
                         th:if="${noteCount > 0 or photoCount > 0}" class="card-footer text-muted small py-1 d-flex gap-3">
                        <span th:if="${noteCount > 0}"><i class="bi bi-journal-text"></i> <span th:text="${noteCount}"></span></span>
                        <span th:if="${photoCount > 0}"><i class="bi bi-image"></i> <span th:text="${photoCount}"></span></span>
                    </div>
                    <th:block th:with="photoRel=${recipe.assets.?[asset.type.name() == 'PHOTO'].size() > 0 ? recipe.assets.?[asset.type.name() == 'PHOTO'][0] : null}">
                        <img th:if="${photoRel != null and !#strings.isEmpty(storagePublicUrl)}"
                             th:src="${storagePublicUrl + '/' + photoRel.asset.thumbPath}"
                             class="card-img-top" style="object-fit: cover; height: 180px;"
                             loading="lazy" alt="">
                    </th:block>
                    <div class="card-body">
                        <!-- UNE SEULE phase → ingrédients/étapes directs -->
                        <div th:with="phase=${recipe.phases.iterator().next()}">
                            <!-- Ingrédients -->
                            <h6><i class="bi bi-egg-fried"></i> Ingrédients</h6>
                            <ul class="list-unstyled small">
                                <li th:each="ingRel : ${recipe.phases[0].ingredientPhases}" 
                                th:text="${ingRel.ingredient.label} + ' : ' + 
                                (${ingRel.quantity} % 1 == 0 ? 
                                ${#numbers.formatDecimal(ingRel.quantity, 0, 0)} : 
                                ${#numbers.formatDecimal(ingRel.quantity, 0, 1)}) + 
                                ' ' + 
                                (${ingRel.ingredient.unit} == null ? '' : ${ingRel.ingredient.unit})">
                            </ul>
                                
                            <!-- Étapes -->
                            <h6 class="mt-3"><i class="bi bi-list-numbered"></i> Étapes</h6>
                            <ol class="small">
                                <li th:each="step : ${phase.steps}" 
                                th:text="${step.label}"></li>
                            </ol>
                        </div>
                        
                        <!-- MULTIPLES phases nommées → détail par phase -->
                        <div th:unless="${#sets.size(recipe.phases) == 1}">
                            <div th:each="phase : ${recipe.phases}" class="mb-4">
                                <h6 class="fw-bold text-primary" th:text="${phase.label}">Phase</h6>
                                
                                <!-- Ingrédients phase -->
                                <div th:if="${#sets.size(phase.ingredientPhases) > 0}">
                                    <small class="text-muted">Ingrédients :</small>
                                    <ul class="list-unstyled small mt-1">
                                        <li th:each="ingRel : ${phase.ingredientPhases}" 
                                        th:text="${ingRel.ingredient.label} + ' : ' + 
                                        (${ingRel.quantity} % 1 == 0 ? 
                                        ${#numbers.formatDecimal(ingRel.quantity, 0, 0)} : 
                                        ${#numbers.formatDecimal(ingRel.quantity, 0, 1)}) + 
                                        ' ' + 
                                        (${ingRel.ingredient.unit} == null ? '' : ${ingRel.ingredient.unit})">
                                    </ul>
                                </div>
                                
                                <!-- Étapes phase -->
                                <div th:if="${#sets.size(phase.steps) > 0}" class="mt-2">
                                    <ol class="small mb-0">
                                        <li th:each="step : ${phase.steps}" 
                                        th:text="${step.label}"></li>
                                    </ol>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>
    <!-- Vue liste (cachée par défaut) -->
    <div th:unless="${recipes.isEmpty()}" id="recipeList" class="d-none">
        <a th:each="recipe : ${recipes}"
           th:href="@{/recette/{id}(id=${recipe.id})}"
           class="text-decoration-none d-block recipe-list-item">
            <div class="d-flex align-items-center justify-content-between py-2 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <th:block th:with="photoRel=${recipe.assets.?[asset.type.name() == 'PHOTO'].size() > 0 ? recipe.assets.?[asset.type.name() == 'PHOTO'][0] : null}">
                        <img th:if="${photoRel != null and !#strings.isEmpty(storagePublicUrl)}"
                             th:src="${storagePublicUrl + '/' + photoRel.asset.thumbPath}"
                             style="width: 48px; height: 48px; object-fit: cover; border-radius: 6px;"
                             loading="lazy" alt="">
                        <div th:unless="${photoRel != null and !#strings.isEmpty(storagePublicUrl)}"
                             style="width: 48px; height: 48px; border-radius: 6px; background: var(--tan); opacity: 0.3; flex-shrink: 0;">
                        </div>
                    </th:block>
                    <div>
                        <span class="fw-semibold text-dark" th:text="${recipe.title}"></span>
                        <div th:if="${!#sets.isEmpty(recipe.tags)}" class="mt-1">
                            <span th:each="tagRel : ${recipe.tags}"
                                  th:text="${tagRel.tag.label}"
                                  class="badge bg-primary me-1" style="font-size: 0.7rem;"></span>
                        </div>
                    </div>
                </div>
                <div th:with="noteCount=${#lists.size(recipe.assets.?[asset.type.name() == 'NOTE'])}, photoCount=${#lists.size(recipe.assets.?[asset.type.name() == 'PHOTO'])}"
                     class="d-flex gap-3 text-muted small flex-shrink-0 ms-3">
                    <span th:if="${noteCount > 0}"><i class="bi bi-journal-text"></i> <span th:text="${noteCount}"></span></span>
                    <span th:if="${photoCount > 0}"><i class="bi bi-image"></i> <span th:text="${photoCount}"></span></span>
                </div>
            </div>
        </a>
    </div>

    </div><!-- fin page-content -->
    <div th:replace="~{fragments/footer :: site-footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script>
        const STORAGE_KEY = 'miette-view';
        const btnGrid = document.getElementById('btnGrid');
        const btnList = document.getElementById('btnList');
        const grid = document.getElementById('recipeGrid');
        const list = document.getElementById('recipeList');

        function setView(mode, save) {
            const isGrid = mode === 'grid';
            grid.classList.toggle('d-none', !isGrid);
            list.classList.toggle('d-none', isGrid);
            btnGrid.classList.toggle('active', isGrid);
            btnList.classList.toggle('active', !isGrid);
            if (save) localStorage.setItem(STORAGE_KEY, mode);
        }

        btnGrid.addEventListener('click', () => setView('grid', true));
        btnList.addEventListener('click', () => setView('list', true));

        setView(localStorage.getItem(STORAGE_KEY) || 'grid', false);
    </script>
</body>
</html>
