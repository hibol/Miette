<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Liste des recettes')}"></head>
<body class="container-fluid px-0 page-liste">
    <div th:replace="~{fragments/header :: site-header}"></div>
    <div th:replace="~{fragments/login-modal :: login-modal}"></div>

    <div class="page-content">
    <div id="liste-paper">
    <!-- Recherche (formulaire GET côté serveur) -->
    <form method="GET" id="searchForm" class="search-field-wrap">
        <label class="search-field">
            <button type="submit" class="search-submit" aria-label="Rechercher"><i class="bi bi-search"></i></button>
            <input type="search" name="q"
                th:value="${query}"
                th:placeholder="${isSearchMode} ? 'Recherche active...' : 'Titre, ingrédients, étapes, tags...'">
        </label>
    </form>

    <!-- Filtres (cases cachées rattachées au formulaire) + tri + vue -->
    <div class="liste-controls">
        <div class="filter-pills">
            <span class="filter-pill-wrap">
                <input class="filter-pill-input" type="checkbox" name="withNotes" id="withNotes" form="searchForm"
                    th:checked="${withNotes}" onchange="this.form.submit()">
                <label class="filter-pill" for="withNotes"><i class="bi bi-journal-text"></i> Avec notes</label>
            </span>
            <span class="filter-pill-wrap">
                <input class="filter-pill-input" type="checkbox" name="withPhotos" id="withPhotos" form="searchForm"
                    th:checked="${withPhotos}" onchange="this.form.submit()">
                <label class="filter-pill" for="withPhotos"><i class="bi bi-image"></i> Avec photos</label>
            </span>
            <span class="filter-pill-wrap" th:if="${isAdmin}">
                <input class="filter-pill-input" type="checkbox" name="withArchived" id="withArchived" form="searchForm"
                    th:checked="${withArchived}" onchange="this.form.submit()">
                <label class="filter-pill" for="withArchived"><i class="bi bi-archive"></i> Archivées</label>
            </span>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <div class="seg-group sort-toggle" role="group" aria-label="Tri">
                <button type="button" class="seg-btn" data-sort="alpha" title="Alphabétique"><i class="bi bi-sort-alpha-down"></i></button>
                <button type="button" class="seg-btn" data-sort="created" title="Plus récemment créées"><i class="bi bi-calendar-plus"></i></button>
                <button type="button" class="seg-btn" data-sort="activity" title="Activité récente"><i class="bi bi-clock-history"></i></button>
            </div>
            <div class="seg-group" id="viewToggle" role="group" aria-label="Affichage">
                <button type="button" class="seg-btn active" id="btnGrid" title="Grille"><i class="bi bi-grid"></i></button>
                <button type="button" class="seg-btn" id="btnList" title="Liste"><i class="bi bi-list-ul"></i></button>
            </div>
        </div>
    </div>

    <!-- Message de succès (ex: suppression) -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i>
        <span th:text="${message}">Supprimé !</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Compteur + nouvelle recette (admin) -->
    <div class="liste-count">
        <span th:text="${resultCount} + (${resultCount > 1} ? ' recettes' : ' recette')">30 recettes</span>
        <a th:if="${isSearchMode or withNotes or withPhotos or withArchived}" href="/recettes" class="liste-count-reset">
            <i class="bi bi-x-lg"></i> Tout afficher
        </a>
        <span class="liste-count-rule"></span>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/recette/new}" class="btn-new-recipe">
            <i class="bi bi-plus-lg"></i> Nouvelle recette
        </a>
    </div>

    <div th:if="${recipes.isEmpty()}" class="liste-empty">Aucune recette</div>

    <div th:unless="${recipes.isEmpty()}" id="recipeGrid" class="recipe-grid">
        <a th:each="recipe : ${recipes}"
           th:href="@{/recette/{id}(id=${recipe.id})}"
           class="recipe-card"
           th:with="ingCount=${#aggregates.sum(recipe.phases.![ingredientPhases.size()]) ?: 0},
                    photoRel=${recipe.assets.?[cover == true and asset.type.name() == 'PHOTO'].size() > 0 ? recipe.assets.?[cover == true and asset.type.name() == 'PHOTO'][0] : (recipe.assets.?[asset.type.name() == 'PHOTO'].size() > 0 ? recipe.assets.?[asset.type.name() == 'PHOTO'][0] : null)}"
           th:attr="data-title=${recipe.title},data-created-at=${recipe.createdAt},data-activity-at=${activityDates[recipe.id]}">
            <span class="recipe-card-tape" aria-hidden="true"><span></span></span>
            <img th:if="${photoRel != null and !#strings.isEmpty(storagePublicUrl)}"
                 th:src="${storagePublicUrl + '/' + photoRel.asset.thumbPath}"
                 class="recipe-card-photo"
                 loading="lazy" alt="">
            <div th:unless="${photoRel != null and !#strings.isEmpty(storagePublicUrl)}"
                 class="recipe-card-photo recipe-card-photo-empty">
                <i class="bi bi-image"></i>
            </div>
            <div class="recipe-card-body">
                <h2 class="recipe-card-title" th:text="${recipe.title}">Recette</h2>
                <div th:if="${!#sets.isEmpty(recipe.tags)}" class="recipe-card-tags">
                    <span th:each="tagRel : ${recipe.tags}"
                          th:text="${tagRel.tag.label}"
                          class="tag-pill"></span>
                </div>
                <div class="recipe-card-foot">
                    <span th:text="${ingCount} + (${ingCount == 1} ? ' ingrédient' : ' ingrédients')">0 ingrédients</span>
                    <i class="bi bi-arrow-right"></i>
                </div>
            </div>
        </a>
    </div>
    <!-- Vue liste (cachée par défaut) -->
    <div th:unless="${recipes.isEmpty()}" id="recipeList" class="d-none">
        <a th:each="recipe : ${recipes}"
           th:href="@{/recette/{id}(id=${recipe.id})}"
           class="text-decoration-none d-block recipe-list-item"
           th:attr="data-title=${recipe.title},data-created-at=${recipe.createdAt},data-activity-at=${activityDates[recipe.id]}">
            <div class="d-flex align-items-center justify-content-between py-2 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <th:block th:with="photoRel=${recipe.assets.?[cover == true and asset.type.name() == 'PHOTO'].size() > 0 ? recipe.assets.?[cover == true and asset.type.name() == 'PHOTO'][0] : (recipe.assets.?[asset.type.name() == 'PHOTO'].size() > 0 ? recipe.assets.?[asset.type.name() == 'PHOTO'][0] : null)}">
                        <img th:if="${photoRel != null and !#strings.isEmpty(storagePublicUrl)}"
                             th:src="${storagePublicUrl + '/' + photoRel.asset.thumbPath}"
                             class="recipe-thumb-sm"
                             loading="lazy" alt="">
                        <div th:unless="${photoRel != null and !#strings.isEmpty(storagePublicUrl)}"
                             class="recipe-thumb-sm-placeholder">
                        </div>
                    </th:block>
                    <div>
                        <span class="fw-semibold text-dark" th:text="${recipe.title}"></span>
                        <div th:if="${!#sets.isEmpty(recipe.tags)}" class="mt-1">
                            <span th:each="tagRel : ${recipe.tags}"
                                  th:text="${tagRel.tag.label}"
                                  class="badge bg-primary me-1 text-xs"></span>
                        </div>
                    </div>
                </div>
                <div th:with="noteCount=${#lists.size(recipe.assets.?[asset.type.name() == 'NOTE'])}, photoCount=${#lists.size(recipe.assets.?[asset.type.name() == 'PHOTO'])}"
                     class="d-flex gap-3 text-muted small flex-shrink-0 ms-3">
                    <span th:if="${noteCount > 0}"><i class="bi bi-journal-text"></i> <span th:text="${noteCount}"></span></span>
                    <span th:if="${photoCount > 0}"><i class="bi bi-image"></i> <span th:text="${photoCount}"></span></span>
                </div>
            </div>
        </a>
    </div>

    </div><!-- fin liste-paper -->
    </div><!-- fin page-content -->
    <div th:replace="~{fragments/footer :: site-footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script>
        const STORAGE_KEY = 'miette-view';
        const btnGrid = document.getElementById('btnGrid');
        const btnList = document.getElementById('btnList');
        const grid = document.getElementById('recipeGrid');
        const list = document.getElementById('recipeList');

        function setView(mode, save) {
            const isGrid = mode === 'grid';
            grid.classList.toggle('d-none', !isGrid);
            list.classList.toggle('d-none', isGrid);
            btnGrid.classList.toggle('active', isGrid);
            btnList.classList.toggle('active', !isGrid);
            if (save) localStorage.setItem(STORAGE_KEY, mode);
        }

        btnGrid.addEventListener('click', () => setView('grid', true));
        btnList.addEventListener('click', () => setView('list', true));

        setView(localStorage.getItem(STORAGE_KEY) || 'grid', false);

        // Tri
        const SORT_KEY = 'miette-recipe-sort';

        function applySort(type, save) {
            if (save) localStorage.setItem(SORT_KEY, type);
            document.querySelectorAll('.sort-toggle .seg-btn').forEach(btn =>
                btn.classList.toggle('active', btn.dataset.sort === type));
            ['recipeGrid', 'recipeList'].forEach(id => {
                const container = document.getElementById(id);
                if (!container) return;
                [...container.children]
                    .sort((a, b) => {
                        if (type === 'created') return new Date(b.dataset.createdAt) - new Date(a.dataset.createdAt);
                        if (type === 'activity') return new Date(b.dataset.activityAt) - new Date(a.dataset.activityAt);
                        return (a.dataset.title || '').localeCompare(b.dataset.title || '', 'fr', { sensitivity: 'base' });
                    })
                    .forEach(el => container.appendChild(el));
            });
        }

        document.querySelectorAll('.sort-toggle .seg-btn').forEach(btn =>
            btn.addEventListener('click', () => applySort(btn.dataset.sort, true)));

        applySort(localStorage.getItem(SORT_KEY) || 'alpha', false);
    </script>
</body>
</html>
