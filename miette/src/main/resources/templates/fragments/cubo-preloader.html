<div th:fragment="cubo-preloader">
<div id="pre-loader" class="cubo-page-loader"></div>
<script th:inline="none">
(function () {
    var el = document.getElementById('pre-loader');
    var size = window.matchMedia('(min-width:768px)').matches ? 300 : 150;
    var col = getComputedStyle(document.documentElement).getPropertyValue('--verdigris').trim();
    if (col.length === 9 && col[0] === '#') col = col.slice(0, 7);
    var lineWidth = size < 300 ? 2 : 4;  // 2px mobile, 4px desktop

    var canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    canvas.style.display = 'block';
    el.appendChild(canvas);
    var ctx = canvas.getContext('2d');

    var s = 1;
    var V = [[s,s,0],[-s,s,0],[s,-s,0],[-s,-s,0],[s,0,s],[-s,0,s],[s,0,-s],[-s,0,-s],[0,s,s],[0,-s,s],[0,s,-s],[0,-s,-s]];
    var E = [[0,4],[0,6],[0,8],[0,10],[1,5],[1,7],[1,8],[1,10],[2,4],[2,6],[2,9],[2,11],[3,5],[3,7],[3,9],[3,11],[4,8],[4,9],[5,8],[5,9],[6,10],[6,11],[7,10],[7,11]];
    var verts = V.map(function (v) { return [v[0], v[1], v[2]]; });
    var SX = 0.03, SY = 0.045, SZ = 0.018, tl = 0, rafId;

    function rot(axis, a) {
        var c = Math.cos(a), sn = Math.sin(a);
        verts.forEach(function (v) {
            if (axis === 0) { var y = v[1]*c - v[2]*sn, z = v[1]*sn + v[2]*c; v[1]=y; v[2]=z; }
            else if (axis === 1) { var x = v[0]*c + v[2]*sn, z = -v[0]*sn + v[2]*c; v[0]=x; v[2]=z; }
            else { var x = v[0]*c - v[1]*sn, y = v[0]*sn + v[1]*c; v[0]=x; v[1]=y; }
        });
    }

    function loop(now) {
        var dt = Math.min(now - tl, 50) * 0.001; tl = now;
        rot(0, SX * Math.PI * 2 * dt);
        rot(1, SY * Math.PI * 2 * dt);
        rot(2, SZ * Math.PI * 2 * dt);
        
        var cx = size / 2, cy = size / 2, fov = 4, lw = Math.max(1, lineWidth);
        
        // Fit sans marge
        var projRaw = verts.map(function (v) { var z = v[2]+fov; return [v[0]/z, v[1]/z]; });
        var xs = projRaw.map(p => p[0]), ys = projRaw.map(p => p[1]);
        var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
        var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
        var w = maxX - minX || 1, h = maxY - minY || 1;
        var fitScale = Math.min(size / w, size / h);
        var offsetX = cx - (minX + maxX) * 0.5 * fitScale;
        var offsetY = cy - (minY + maxY) * 0.5 * fitScale;
        
        ctx.clearRect(0, 0, size, size);
        var p = verts.map(function (v) { 
            var z = v[2]+fov; 
            return [v[0]/z * fitScale + offsetX, v[1]/z * fitScale + offsetY, z]; 
        });
        
        E.forEach(function (e) {
            var a = p[e[0]], b = p[e[1]];
            var z_avg = (a[2] + b[2]) / 2;
            var al = Math.min(0.9, Math.max(0.05, 1 - (z_avg - 1) / 6));
            ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
            var edgeWeight = Math.max(1, 3 - z_avg);  // arêtes proches = plus épaisses
            ctx.lineWidth = lw * edgeWeight;
            ctx.globalAlpha = al; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
        });
        ctx.globalAlpha = 1;
        rafId = requestAnimationFrame(loop);
    }
    rafId = requestAnimationFrame(loop);

    window._stopCuboPreloader = function () {
        cancelAnimationFrame(rafId);
        el.remove();
        delete window._stopCuboPreloader;
    };
})();
</script>
</div>
