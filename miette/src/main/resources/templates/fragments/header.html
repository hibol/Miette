<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<!-- Fragment header -->
 <th:block th:fragment="site-header">
    <header class="site-header">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/recettes}" class="site-brand text-decoration-none text-dark d-flex align-items-center gap-2">
                    <img th:src="@{/cuboctahedron_logo.svg}" class="site-logo" alt="" width="50" height="50">
                    <h1 class="site-title mb-0 align-self-center">Chez Miette</h1>
                </a>
            </div>

            <div class="d-flex align-items-center gap-2">
                <button class="header-btn" id="style-toggle" title="Style">
                    <i class="bi bi-palette-fill" id="style-icon"></i>
                </button>
                <button class="header-btn" id="theme-toggle" title="Thème">
                    <i class="bi bi-moon-fill" id="theme-icon"></i>
                </button>

                <!-- Non connecté -->
                <div sec:authorize="!isAuthenticated()">
                    <button class="header-btn" data-bs-toggle="modal" data-bs-target="#loginModal">
                        <i class="bi bi-person-circle"></i>
                        <span class="d-none d-md-inline"> Connexion</span>
                    </button>
                </div>

                <!-- Connecté -->
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <span class="d-none d-md-inline me-1">
                        Bonjour, <span th:text="${#authentication.name}">admin</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" name="redirectTo" th:value="${currentPath}">
                        <button type="submit" class="header-btn">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="d-none d-md-inline"> Déconnexion</span>
                        </button>
                    </form>
                    <a th:href="@{/admin}" class="header-btn" title="Administration">
                        <i class="bi bi-gear"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <script>
        (function () {
            const header = document.querySelector('.site-header');
            const syncHeaderHeight = () =>
                document.documentElement.style.setProperty('--site-header-h', header.offsetHeight + 'px');
            syncHeaderHeight();
            window.addEventListener('resize', syncHeaderHeight);
        }());
        (function () {
            const styleIcon = document.getElementById('style-icon');
            function applyStyle(flat) {
                document.documentElement.classList.toggle('style-flat', flat);
                styleIcon.className = flat ? 'bi bi-palette' : 'bi bi-palette-fill';
            }
            applyStyle(document.documentElement.classList.contains('style-flat'));
            document.getElementById('style-toggle').addEventListener('click', function () {
                const flat = !document.documentElement.classList.contains('style-flat');
                localStorage.setItem('style', flat ? 'flat' : 'cuisine');
                applyStyle(flat);
            });
        }());
        (function () {
            const icon = document.getElementById('theme-icon');
            function applyTheme(dark) {
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                icon.className = dark ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
            }
            applyTheme(document.documentElement.getAttribute('data-theme') === 'dark');
            document.getElementById('theme-toggle').addEventListener('click', function () {
                const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
                localStorage.setItem('theme', dark ? 'dark' : 'light');
                document.documentElement.classList.add('theme-transition');
                applyTheme(dark);
                window.setTimeout(() => document.documentElement.classList.remove('theme-transition'), 600);
            });
        }());
    </script>
</th:block>
</body>
</html>
