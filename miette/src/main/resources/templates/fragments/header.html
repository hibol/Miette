<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<!-- Fragment header -->
 <div th:fragment="site-header">
    <header class="site-header">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/recettes}" class="text-decoration-none text-dark d-flex align-items-center gap-2">
                    <img th:src="@{/cuboctahedron_logo.svg}" alt="" width="50" height="50">
                    <h1 class="mb-0 fs-1 align-self-center">Chez Miette</h1>
                </a>
            </div>

            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-secondary" id="theme-toggle" title="Thème">
                    <i class="bi bi-moon-fill" id="theme-icon"></i>
                </button>

                <!-- Non connecté -->
                <div sec:authorize="!isAuthenticated()">
                    <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">
                        <i class="bi bi-person-circle"></i>
                        <span class="d-none d-md-inline"> Connexion</span>
                    </button>
                </div>

                <!-- Connecté -->
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <span class="d-none d-md-inline me-1">
                        Bonjour, <span th:text="${#authentication.name}">admin</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" name="redirectTo" th:value="${currentPath}">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="d-none d-md-inline"> Déconnexion</span>
                        </button>
                    </form>
                    <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-gear"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <script>
        (function () {
            const icon = document.getElementById('theme-icon');
            function applyTheme(dark) {
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                icon.className = dark ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
            }
            applyTheme(document.documentElement.getAttribute('data-theme') === 'dark');
            document.getElementById('theme-toggle').addEventListener('click', function () {
                const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
                localStorage.setItem('theme', dark ? 'dark' : 'light');
                applyTheme(dark);
            });
        }());
    </script>
</div>
</body>
</html>
