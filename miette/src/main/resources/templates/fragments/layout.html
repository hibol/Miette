<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Mes Recettes</title>
    <meta property="og:site_name" content="Chez Miette">
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${title}">
    <meta property="og:image" th:if="${ogImage != null}" th:content="${ogImage}">
    <meta property="og:description" th:if="${ogDescription != null}" th:content="${ogDescription}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/bocal_favicon.svg}">
    <script>(function(){if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}());</script>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <script th:if="${@umamiProperties.websiteId != null and !@umamiProperties.websiteId.isEmpty()}"
            defer src="/script.js"
            th:attr="data-website-id=${@umamiProperties.websiteId},src=${@umamiProperties.url + '/script.js'}"></script>
</head>


<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</div>
