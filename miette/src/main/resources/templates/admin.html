<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin')}"></head>
<body class="container mt-5">
    <div th:replace="~{fragments/header :: site-header}"></div>
    <div th:replace="~{fragments/login-modal :: login-modal}"></div>

    <h2 class="mb-4"><i class="bi bi-gear"></i> Administration</h2>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Index de recherche</h5>
            <p class="card-text text-muted">Reconstruit l'index full-text à partir de toutes les recettes existantes.</p>
            <form th:action="@{/admin/search/reindex}" method="post">
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-arrow-clockwise"></i> Reconstruire l'index
                </button>
            </form>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <h5 class="card-title">Ingrédients orphelins</h5>
            <p class="card-text text-muted">
                Ingrédients présents en base mais n'appartenant à aucune recette.
            </p>

            <div th:if="${#lists.isEmpty(orphanIngredients)}" class="text-success mb-3">
                <i class="bi bi-check-circle"></i> Aucun ingrédient orphelin.
            </div>

            <div th:if="${!#lists.isEmpty(orphanIngredients)}">
                <ul class="list-group list-group-flush mb-3">
                    <li th:each="ing : ${orphanIngredients}"
                        class="list-group-item px-0">
                        <span th:text="${ing.label}"></span>
                        <span th:if="${ing.unit}" class="text-muted ms-1"
                              th:text="'(' + ${ing.unit} + ')'"></span>
                    </li>
                </ul>
                <form th:action="@{/admin/ingredients/purge-orphans}" method="post"
                      onsubmit="return confirm('Supprimer les ' + this.dataset.count + ' ingrédient(s) orphelin(s) ?')"
                      th:data-count="${#lists.size(orphanIngredients)}">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i>
                        Supprimer les <span th:text="${#lists.size(orphanIngredients)}"></span> orphelin(s)
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <h5 class="card-title">Changer le mot de passe</h5>
            <form th:action="@{/admin/change-password}" method="post" class="mt-3" style="max-width: 400px">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Mot de passe actuel</label>
                    <input type="password" id="currentPassword" name="currentPassword"
                           th:classappend="${errorCurrentPassword} ? 'is-invalid'"
                           class="form-control">
                    <div th:if="${errorCurrentPassword}" class="invalid-feedback" th:text="${errorCurrentPassword}"></div>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">Nouveau mot de passe</label>
                    <input type="password" id="newPassword" name="newPassword"
                           th:classappend="${errorNewPassword} ? 'is-invalid'"
                           class="form-control">
                    <div th:if="${errorNewPassword}" class="invalid-feedback" th:text="${errorNewPassword}"></div>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirmer le nouveau mot de passe</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           th:classappend="${errorConfirmPassword} ? 'is-invalid'"
                           class="form-control">
                    <div th:if="${errorConfirmPassword}" class="invalid-feedback" th:text="${errorConfirmPassword}"></div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-key"></i> Changer le mot de passe
                </button>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
