spring.application.name=miette
server.port=8080
server.forward-headers-strategy=native
spring.datasource.url=jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.devtools.restart.enabled=true
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Storage (Cloudflare R2 en prod, MinIO en local)
storage.endpoint=${STORAGE_ENDPOINT:}
storage.bucket=${STORAGE_BUCKET:}
storage.access-key=${STORAGE_ACCESS_KEY:}
storage.secret-key=${STORAGE_SECRET_KEY:}
storage.public-url=${STORAGE_PUBLIC_URL:}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Umami Analytics
umami.url=${UMAMI_URL:}
umami.username=${UMAMI_USERNAME:}
umami.password=${UMAMI_PASSWORD:}
umami.website-id=${UMAMI_WEBSITE_ID:}

# Hibernate Search
spring.jpa.properties.hibernate.search.backend.directory.root=${LUCENE_INDEX_DIR:./lucene-index}
spring.jpa.properties.hibernate.search.schema_management.strategy=create-or-validate
spring.jpa.properties.hibernate.search.backend.analysis.configurer=bean:luceneAnalysisConfigurer