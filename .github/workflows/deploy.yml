name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/miette:latest

      - name: Deploy on server
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          mkdir -p ~/.ssh
          echo "138.199.213.152 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKBXbebnHdxjWfJyhV+FD4y6fnK+NuZMBixItCOJDTb4" >> ~/.ssh/known_hosts
          ssh -i /tmp/deploy_key \
            "$USER@$HOST" \
            "cd ~/miette && docker compose pull && docker compose up -d && docker image prune -f"
          rm /tmp/deploy_key
