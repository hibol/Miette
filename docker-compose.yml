services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"  # Console : http://localhost:9001 (minioadmin / minioadmin)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/miette --ignore-existing;
      mc anonymous set public local/miette;
      echo 'MinIO ready.';
      "

volumes:
  minio_data:

# Variables d'env à ajouter localement :
#
# STORAGE_ENDPOINT=http://localhost:9000
# STORAGE_BUCKET=miette
# STORAGE_ACCESS_KEY=minioadmin
# STORAGE_SECRET_KEY=minioadmin
# STORAGE_PUBLIC_URL=http://localhost:9000/miette
